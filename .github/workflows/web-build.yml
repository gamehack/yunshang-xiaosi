name: M0 Web build
on:
  push:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/web-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
